[package]
name = "sortforge_3d"
version = "0.1.0"
edition = "2021"
description = "A real-time 3D sorting algorithm visualization engine written in Rust and wgpu."
license = "MIT"
repository = "https://github.com/jobendik/sortforge-3d"
readme = "README.md"
keywords = ["visualization", "sorting", "wgpu", "graphics", "algorithms"]
categories = ["graphics", "visualization"]

[dependencies]
wgpu = "25"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
egui = "0.32"
egui-winit = "0.32"
egui-wgpu = "0.32"

[profile.release]
opt-level = 3
lto = "thin"
